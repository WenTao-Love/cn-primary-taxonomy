name: deploy-github-pages

on:
  push:
    branches:
      - cn-primary-taxonomy
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild standalone artifacts
        run: |
          node scripts/build-standalone.mjs
          node scripts/build-split-standalone.mjs

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp cn-primary-taxonomy.html site/index.html
          cp cn-primary-taxonomy.html site/cn-primary-taxonomy.html
          cp cn-primary-taxonomy-split.html site/cn-primary-taxonomy-split.html
          cp -r standalone-data site/standalone-data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
