  --bg-secondary: #EEF4FF;
  --card-bg-from: #FFFFFF;
  --card-bg-to: #F2F7FF;
  --card-border: rgba(37,99,235,0.14);
  --card-radius: 18px;
  --text-primary: #102A43;
  --text-secondary: #52667A;
  --accent-1: #2563EB;
  --accent-2: #1D4ED8;
  --accent-3: #0EA5E9;
  --accent-4: #059669;
  --font-family: &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, system-ui, sans-serif;
  --danger: #DC2626;
  --success: #059669;
  --violet: #7C3AED;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  width: 1280px;
  height: 720px;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at top right, rgba(37,99,235,0.10), transparent 32%),
    radial-gradient(circle at bottom left, rgba(14,165,233,0.10), transparent 28%),
    linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
  color: var(--text-primary);
  font-family: var(--font-family);
}
.bg-shape {
  position: absolute;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(37,99,235,0.10), rgba(14,165,233,0.06));
}
.shape-a { width: 280px; height: 280px; right: -70px; top: -90px; }
.shape-b { width: 220px; height: 220px; left: -80px; bottom: -80px; }
.shape-c { width: 140px; height: 140px; right: 220px; bottom: 100px; opacity: 0.55; }
.title-area {
  position: absolute;
  left: 48px;
  top: 32px;
  width: 1184px;
  height: 108px;
}
.overline {
  font-size: 13px;
  letter-spacing: 2.5px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--part-accent);
  margin-bottom: 10px;
}
.page-title {
  margin: 0;
  font-size: 34px;
  line-height: 1.18;
  font-weight: 800;
  color: var(--text-primary);
}
.title-underline {
  width: 96px;
  height: 5px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--part-accent), var(--accent-2));
  margin-top: 12px;
}
.summary-pill {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.82);
  border: 1px solid rgba(37,99,235,0.12);
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 1120px;
}
.content-area {
  position: absolute;
  left: 48px;
  top: 164px;
  width: 1184px;
  height: 506px;
  display: grid;
  gap: 16px;
}
.layout-two {
  grid-template-columns: 1fr 1fr;
}
.layout-three {
  grid-template-columns: repeat(3, 1fr);
}
.layout-main-sub {
  grid-template-columns: 2fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.layout-hero-3 {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 220px 1fr;
}
.layout-mixed-5 {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 1fr 1fr;
}
.layout-mixed-6 {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 1fr 1fr;
}
.card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--card-bg-from), var(--card-bg-to));
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  box-shadow: 0 14px 32px rgba(16,42,67,0.06);
  padding: 20px 22px 18px 22px;
}
.card::selection {
  background: rgba(37,99,235,0.18);
}
.card-line {
  position: absolute;
  left: 0;
  top: 20px;
  width: 4px;
  height: 72px;
  border-radius: 0 999px 999px 0;
  background: linear-gradient(180deg, var(--part-accent), transparent);
}
.card-glow {
  position: absolute;
  right: -30px;
  top: -30px;
  width: 100px;
  height: 100px;
  border-radius: 999px;
  background: radial-gradient(circle, rgba(37,99,235,0.10), transparent 65%);
}
.card-title {
  margin: 0 0 12px 0;
  font-size: 22px;
  line-height: 1.22;
  font-weight: 800;
  color: var(--text-primary);
}
.card-copy {
  font-size: 14px;
  line-height: 1.65;
  color: var(--text-secondary);
}
.card-copy p {
  margin: 0 0 8px 0;
}
.card-copy strong {
  color: var(--text-primary);
}
.bullet-list {
  margin-top: 12px;
  display: grid;
  gap: 10px;
}
.bullet-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 14px;
  line-height: 1.56;
  color: var(--text-secondary);
}
.bullet-dot {
  width: 8px;
  height: 8px;
  min-width: 8px;
  margin-top: 7px;
  border-radius: 999px;
  background: var(--part-accent);
}
.data-top {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 10px;
}
.data-value {
  font-size: 46px;
  line-height: 1;
  font-weight: 900;
  color: var(--part-accent);
  font-variant-numeric: tabular-nums;
}
.data-label {
  font-size: 16px;
  color: var(--text-secondary);
  font-weight: 700;
}
.trend-pill {
  display: inline-flex;
  margin-top: 10px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(37,99,235,0.10);
  color: var(--part-accent);
  font-size: 13px;
  font-weight: 700;
}
.progress-track {
  margin-top: 14px;
  width: 100%;
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(16,42,67,0.08);
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--part-accent), var(--accent-2));
}
.chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid rgba(37,99,235,0.20);
  background: rgba(255,255,255,0.82);
  font-size: 13px;
  color: var(--part-accent);
  font-weight: 700;
}
.process-list {
  margin-top: 12px;
  display: grid;
  gap: 12px;
}
.process-step {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 12px;
  align-items: start;
}
.process-number {
  width: 30px;
  height: 30px;
  border-radius: 999px;
  background: var(--part-accent);
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}
.process-main {
  font-size: 14px;
  line-height: 1.52;
  color: var(--text-secondary);
}
.process-main strong {
  display: block;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.compare-wrap {
  margin-top: 14px;
  display: grid;
  gap: 10px;
}
.compare-row {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  align-items: center;
  gap: 12px;
}
.compare-name {
  font-size: 13px;
  color: var(--text-primary);
  font-weight: 700;
}
.compare-track {
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(16,42,67,0.08);
}
.compare-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--part-accent), var(--accent-2));
}
.compare-label {
  font-size: 13px;
  color: var(--text-secondary);
}
.wide {
  grid-column: span 2;
}
.hero {
  grid-column: 1 / -1;
}
.tall {
  grid-row: 1 / -1;
}
.footer {
  position: absolute;
  left: 48px;
  right: 48px;
  bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 1px;
  color: rgba(82,102,122,0.78);
}
.footer-right {
  font-variant-numeric: tabular-nums;
}
.cover-shell,
.section-shell,
.end-shell {
  position: absolute;
  inset: 0;
}
.cover-left {
  position: absolute;
  left: 64px;
  top: 72px;
  width: 560px;
}
.cover-kicker {
  display: inline-flex;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(37,99,235,0.10);
  border: 1px solid rgba(37,99,235,0.16);
  color: var(--accent-1);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
}
.cover-title {
  margin: 20px 0 0 0;
  font-size: 54px;
  line-height: 1.1;
  font-weight: 900;
  color: var(--text-primary);
}
.cover-subtitle {
  margin-top: 18px;
  font-size: 23px;
  line-height: 1.55;
  color: var(--text-secondary);
}
.cover-meta {
  margin-top: 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.cover-meta span {
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.84);
  border: 1px solid rgba(37,99,235,0.12);
  font-size: 13px;
  color: var(--text-primary);
  font-weight: 700;
}
.cover-right {
  position: absolute;
  right: 64px;
  top: 56px;
  width: 520px;
  height: 606px;
  border-radius: 32px;
  background: linear-gradient(150deg, rgba(37,99,235,0.18), rgba(14,165,233,0.12));
  border: 1px solid rgba(37,99,235,0.16);
  overflow: hidden;
}
.hero-panel {
  position: absolute;
  border-radius: 24px;
  background: rgba(255,255,255,0.86);
  border: 1px solid rgba(37,99,235,0.12);
  box-shadow: 0 16px 28px rgba(16,42,67,0.08);
}
.hero-panel-a { left: 30px; top: 30px; width: 460px; height: 194px; }
.hero-panel-b { left: 30px; top: 238px; width: 220px; height: 308px; }
.hero-panel-c { right: 30px; top: 238px; width: 220px; height: 308px; }
.hero-ring {
  position: absolute;
  right: -30px;
  top: -30px;
  width: 190px;
  height: 190px;
  border-radius: 999px;
  border: 26px solid rgba(37,99,235,0.10);
}
.hero-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 26px;
}
.mini-card {
  border-radius: 18px;
  background: linear-gradient(180deg, #FFFFFF, #F7FAFF);
  border: 1px solid rgba(37,99,235,0.10);
  padding: 14px;
}
.mini-label {
  font-size: 13px;
  color: var(--text-secondary);
}
.mini-value {
  margin-top: 10px;
  font-size: 34px;
  line-height: 1;
  font-weight: 900;
  color: var(--accent-1);
}
.hero-list {
  padding: 20px;
  display: grid;
  gap: 10px;
}
.hero-task {
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(37,99,235,0.06);
  border: 1px solid rgba(37,99,235,0.10);
  font-size: 14px;
  line-height: 1.35;
  color: var(--text-primary);
  font-weight: 700;
}
.hero-task span {
  display: block;
  margin-top: 5px;
  font-size: 13px;
  line-height: 1.38;
  font-weight: 400;
  color: var(--text-secondary);
}
.section-center {
  position: absolute;
  left: 72px;
  top: 96px;
  right: 72px;
  bottom: 96px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.section-number {
  font-size: 18px;
  letter-spacing: 5px;
  font-weight: 800;
  color: var(--part-accent);
}
.section-title {
  margin-top: 18px;
  font-size: 48px;
  line-height: 1.15;
  font-weight: 900;
  color: var(--text-primary);
  max-width: 860px;
}
.section-subtitle {
  margin-top: 18px;
  max-width: 780px;
  font-size: 18px;
  line-height: 1.7;
  color: var(--text-secondary);
}
.section-quote {
  margin-top: 28px;
  display: inline-flex;
  align-self: flex-start;
  padding: 12px 16px;
  border-radius: 18px;
  background: rgba(255,255,255,0.84);
  border: 1px solid rgba(37,99,235,0.12);
  font-size: 14px;
  color: var(--text-primary);
}
.section-watermark {
  position: absolute;
  right: 76px;
  bottom: 52px;
  font-size: 160px;
  line-height: 1;
  font-weight: 900;
  color: rgba(37,99,235,0.07);
}
.toc-shell {
  position: absolute;
  inset: 0;
}
.toc-title {
  position: absolute;
  left: 60px;
  top: 54px;

}
.toc-grid {
  position: absolute;

  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 1fr 1fr;
  gap: 18px;
}
.toc-card {
  padding: 22px;
  border-radius: 22px;
  background: linear-gradient(180deg, #FFFFFF, #F3F8FF);
  border: 1px solid rgba(37,99,235,0.12);
  box-shadow: 0 12px 24px rgba(16,42,67,0.05);
}
.toc-index {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  background: rgba(37,99,235,0.10);
  color: var(--accent-1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 900;
}
.toc-card h3 {
  margin: 16px 0 8px 0;

  line-height: 1.35;
}
.toc-card p {
  margin: 0;
  font-size: 13px;
  line-height: 1.65;
  color: var(--text-secondary);
}
.timeline {

  left: 60px;
  right: 60px;
  bottom: 72px;

  grid-template-columns: repeat(6, 1fr);

}
.timeline-item {

  border-radius: 16px;

  border: 1px solid rgba(37,99,235,0.12);
}
.timeline-item strong {
  display: block;
  font-size: 12px;
  color: var(--text-primary);
}
.timeline-item span {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-secondary);
}
.end-main {
  position: absolute;
  left: 84px;
  top: 92px;
  right: 84px;
}
.end-title {
  margin: 0;
  font-size: 46px;
  line-height: 1.12;

}
.end-subtitle {
  margin-top: 16px;
  font-size: 20px;

  color: var(--text-secondary);
}
.end-grid {

  gap: 18px;
}
.end-card {

  background: linear-gradient(180deg, #FFFFFF, #F5F8FF);
  border: 1px solid rgba(37,99,235,0.12);
}
.end-card strong {
  display: block;
  margin-bottom: 12px;

}
.end-card p {
  margin: 0;
  font-size: 14px;

  color: var(--text-secondary);
}
.end-quote {
  position: absolute;
  left: 84px;
  bottom: 70px;

  background: rgba(255,255,255,0.86);
  border: 1px solid rgba(37,99,235,0.12);

  color: var(--text-primary);
}

<div class="nav-hint">Arrow keys to navigate</div>
<script>
let cur = 0;
const frames = document.querySelectorAll('.slide-frame');
const total = frames.length;
const info = document.getElementById('page-info');
const stage = document.getElementById('stage');

function resize() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const scale = Math.min(sw / 1280, sh / 720);
  frames.forEach(f => f.style.transform = 'scale(' + scale + ')');
}
function show(i) {
  frames.forEach((f, idx) => f.style.display = idx === i ? 'block' : 'none');
  info.textContent = (i+1) + ' / ' + total;
  document.getElementById('btn-prev').disabled = i === 0;
  document.getElementById('btn-next').disabled = i === total - 1;
}
function nav(d) {
  const n = cur + d;
  if (n >= 0 && n < total) { cur = n; show(cur); }
}
document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') nav(-1);
  if (e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') nav(1);
});
window.addEventListener('resize', resize);
resize();
show(0);
</script>
