<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>

:root {
  --bg-primary: #FFFFFF;
  --bg-secondary: #F8FAFC;
  --card-bg-from: #F1F5F9;
  --card-bg-to: #E2E8F0;
  --card-border: rgba(37,99,235,0.12);
  --card-radius: 12px;
  --text-primary: #1E293B;
  --text-secondary: #64748B;
  --accent-1: #2563EB;
  --accent-2: #1D4ED8;
  --accent-3: #059669;
  --accent-4: #047857;
  --font-family: PingFang SC, Microsoft YaHei, system-ui, sans-serif;
}

body {
  margin: 0; padding: 0;
  width: 1280px; height: 720px;
  background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
  font-family: var(--font-family);
  color: var(--text-primary);
  overflow: hidden;
  position: relative;
}
.title-area {
  position: absolute;
  left: 40px; top: 40px;
  width: 1200px; height: 50px;
}
.page-title {
  font-size: 32px; font-weight: 700; margin: 0;
  position: relative;
  display: inline-block;
}
.page-title::after {
  content: ''; position: absolute;
  left: 0; bottom: -8px;
  width: 60px; height: 4px;
  background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  border-radius: 2px;
}
.content-area {
  position: absolute;
  left: 40px; top: 120px;
  width: 1200px; height: 540px;
  display: grid;
  gap: 20px;
}
.card {
  background: linear-gradient(135deg, var(--card-bg-from), var(--card-bg-to));
  border: 1px solid var(--card-border);
  border-radius: var(--card-radius);
  padding: 24px;
  display: flex; flex-direction: column;
  position: relative;
  overflow: hidden;
}
.card-title {
  font-size: 20px; font-weight: 700; margin: 0 0 16px 0;
  color: var(--text-primary);
}
.card-content {
  font-size: 14px; line-height: 1.8; color: var(--text-secondary);
  flex: 1;
}
.data-card .core-data {
  font-size: 48px; font-weight: 800; color: var(--accent-1);
  font-variant-numeric: tabular-nums;
  margin: 10px 0;
}
.footer {
  position: absolute; bottom: 20px; left: 40px; right: 40px;
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text-secondary); opacity: 0.6;
}
/* Grid Layouts */
.layout-single { grid-template: 1fr / 1fr; }
.layout-50-50 { grid-template: 1fr / 1fr 1fr; }
.layout-23-13 { grid-template: 1fr / 2fr 1fr; }
.layout-3col { grid-template: 1fr / repeat(3, 1fr); }
.layout-main-sub { grid-template: 1fr 1fr / 2fr 1fr; }
.layout-hero-3 { grid-template: auto 1fr / repeat(3, 1fr); }
.layout-mixed { grid-template: repeat(2, 1fr) / 1fr 1fr; }
.highlight {
  color: var(--accent-1); font-weight: bold;
}
</style>
</head>
<body>

        <div class="title-area">
            <h1 class="page-title">AI时代的寿险员工生存指南</h1>
        </div>
        <div class="content-area layout-main-sub">
            
        <div class="card" style="grid-row: 1 / -1;">
            <h3 class="card-title">灵魂拷问：AI会淘汰我们吗？</h3>
            <div class="card-content">不会。AI 没有同理心，它无法在一个家庭遭遇变故时，握住客户的手给予温度；它也无法在线下酒会上与客户建立深厚的信任关系。寿险的核心永远是“人”。</div>
        </div>
        
        <div class="card" style="">
            <h3 class="card-title">生存法则</h3>
            <div class="card-content">让 AI 帮你写稿、算公式、想点子、理思路。让你有更多时间去“与人打交道”。</div>
        </div>
        
        <div class="card" style="">
            <h3 class="card-title">共勉</h3>
            <div class="card-content">AI大发展大时代，技术日新月异。别怕落后，我们都是<span class="highlight">赶路人</span>！</div>
        </div>
        
        </div>
        
<div class="footer">
  <span>深圳分公司AI赋能培训 - AI时代的寿险员工生存指南</span>
  <span>12 / 13 | QClaw AI Training</span>
</div>
</body>
</html>
