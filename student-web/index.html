<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>知识大闯关 · 小朋友版 | CN-Primary-Taxonomy</title>
<meta name="description" content="小学生知识闯关游戏，通过答题获得星星奖励，覆盖11学科4275个知识点，让学习更有趣。">
<meta property="og:title" content="知识大闯关 · 小朋友版">
<meta property="og:description" content="小学生知识闯关游戏，覆盖11学科4275个知识点">
<meta property="og:type" content="website">
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="../shared/css/common.css">
<link rel="stylesheet" href="../shared/css/responsive.css">
<link rel="stylesheet" href="css/student.css">
</head>
<body class="cnpt-role-student">
<a href="#main-content" class="cnpt-skip-link" style="position:absolute;top:-100%;left:16px;z-index:99999;padding:10px 20px;background:#5dade2;color:#fff;font-size:13px;font-weight:600;text-decoration:none;border-radius:0 0 8px 8px;transition:top 0.2s;" onfocus="this.style.top='0'" onblur="this.style.top='-100%'">跳到主内容</a>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">知识大闯关 · 小朋友版</h1>
<!-- 加载指示器 -->
<div id="cnpt-loading" class="cnpt-loading-screen">
  <div class="cnpt-loading-spinner"></div>
  <div class="cnpt-loading-text">知识图谱加载中...</div>
  <div class="cnpt-loading-progress"></div>
</div>
<div id="main-content" class="cnpt-app-layout" tabindex="-1">
  <!-- 顶部状态栏 -->
  <header id="top-bar" class="cnpt-top-bar">
    <div class="cnpt-top-left">
      <span class="cnpt-top-logo">🌟 知识大闯关</span>
    </div>
    <div class="cnpt-top-right">
      <div class="cnpt-stars-display">
        <span class="cnpt-star-icon">⭐</span>
        <span id="star-count">0</span>
      </div>
      <button class="cnpt-mode-switch" id="mode-switch" title="切换到家长模式">👨‍👩‍家长模式</button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="cnpt-main-content">
    <!-- 欢迎面板 -->
    <div class="cnpt-welcome-card" id="welcome-card">
      <div class="cnpt-mascot-large">🦊</div>
      <h2>你好呀！我是小知</h2>
      <p>欢迎来到知识的海洋！和我一起探索吧~</p>
    </div>

    <!-- 学习统计 -->
    <div id="daily-plan" class="cnpt-dayplan"></div>
    <button class="cnpt-rcd-entry" id="btn-rcd">🔍 根因诊断 · 找出“病根”</button>
    <div class="cnpt-stats-grid">
      <div class="cnpt-stat-card">
        <div class="cnpt-stat-num" id="stat-mastered">0</div>
        <div class="cnpt-stat-label">已学会 ✅</div>
      </div>
      <div class="cnpt-stat-card">
        <div class="cnpt-stat-num" id="stat-learning">0</div>
        <div class="cnpt-stat-label">学习中 📖</div>
      </div>
      <div class="cnpt-stat-card">
        <div class="cnpt-stat-num" id="stat-stars">0</div>
        <div class="cnpt-stat-label">小星星 ⭐</div>
      </div>
    </div>

    <!-- 科目选择 -->
    <div class="cnpt-section">
      <h3 class="cnpt-section-title">📚 选择你想学的</h3>
      <div class="cnpt-subject-grid" id="subject-grid"></div>
    </div>

    <!-- 知识点浏览 -->
    <div class="cnpt-section cnpt-hidden" id="topic-section">
      <h3 class="cnpt-section-title">
        <button class="cnpt-back-btn" id="back-to-subjects">←</button>
        <span id="current-subject-title">知识点</span>
      </h3>
      <div class="cnpt-topic-filters" id="topic-filters"></div>
      <div class="cnpt-topic-list" id="topic-list"></div>
    </div>

    <!-- 节点详情卡 -->
    <div class="cnpt-detail-card cnpt-hidden" id="detail-card">
      <div class="cnpt-detail-header">
        <h2 id="detail-name"></h2>
        <button class="cnpt-detail-close" id="detail-close">×</button>
      </div>
      <div class="cnpt-detail-body" id="detail-body"></div>
    </div>

    <!-- 鼓励提示条 -->
    <div class="cnpt-encourage-bar" id="encourage-bar"></div>

    <!-- Mascot -->
    <div class="cnpt-mascot" id="mascot">
      <div class="cnpt-mascot-bubble" id="mascot-bubble"></div>
      🦊
    </div>
  </main>
</div>

<!-- 练习弹窗 -->
<div class="cnpt-modal-overlay cnpt-hidden" id="practice-modal">
  <div class="cnpt-modal-content">
    <div class="cnpt-modal-header">
      <span class="cnpt-modal-title" id="practice-title">练习题</span>
      <button class="cnpt-modal-close" id="practice-close">×</button>
    </div>
    <div class="cnpt-modal-body" id="practice-body"></div>
  </div>
</div>

<!-- 根因诊断弹窗 -->
<div class="cnpt-modal-overlay cnpt-hidden" id="rcd-modal">
  <div class="cnpt-modal-content cnpt-rcd-content">
    <div class="cnpt-modal-header">
      <span class="cnpt-modal-title" id="rcd-title">🔍 根因诊断</span>
      <button class="cnpt-modal-close" id="rcd-close">×</button>
    </div>
    <div class="cnpt-modal-body" id="rcd-body"></div>
  </div>
</div>

<!-- 脚本 -->
<script src="../shared/js/core/constants.js"></script>
<script src="../shared/js/core/utils.js"></script>
<script src="../shared/js/core/data-loader.js"></script>
<script src="../shared/js/core/indices.js"></script>
<script src="../shared/js/core/search.js"></script>
<script src="../shared/js/core/path.js"></script>
<script src="../shared/js/core/storage.js"></script>
<script src="../shared/js/core/multi-user-storage.js"></script>
<script src="../shared/js/components/show-load-error.js"></script>
<script src="../shared/js/components/mascot-effects.js"></script>
<script src="../shared/js/components/topic-tags.js"></script>
<script src="../shared/js/components/mastery-row.js"></script>
<script src="../shared/js/components/diagnostic-engine.js"></script>
<script src="../shared/js/components/report-generator.js"></script>
<script src="../shared/js/components/error-feedback.js"></script>
<script src="../shared/js/components/bookmarks.js"></script>
<script src="../shared/js/components/voice-search.js"></script>
<script src="../shared/js/components/share-card.js"></script>
<script src="../shared/js/components/pwa-register.js"></script>
<script src="../shared/js/components/data-export.js"></script>
<script src="../shared/js/components/theme-manager.js"></script>
<script src="../shared/js/components/onboarding.js"></script>
<script src="../shared/js/components/search-history.js"></script>
<script src="../shared/js/components/node-detail.js"></script>
<script src="../shared/js/components/fsrs-scheduler.js"></script>
<script src="../shared/js/components/fsrs-engine.js"></script>
<script src="../shared/js/components/diagnostic-loop.js"></script>
<script src="../shared/js/components/daily-plan.js"></script>
<script src="../shared/js/components/root-cause-diagnosis.js"></script>
<script src="../shared/js/components/visual-models.js"></script>
<script src="../shared/js/components/spelling-quest.js"></script>
<script src="js/student.js"></script>
</body>
</html>
