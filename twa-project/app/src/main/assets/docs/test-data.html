<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Data Test</title>
    <style>
        body { font-family: Arial; padding: 20px; font-size: 18px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>数据加载测试</h1>
    <div id="status">正在加载...</div>
    <div id="result"></div>
    
    <script>
        // 内嵌数据
        const topicsData = {"version": "test", "topics": [{"id": "test1", "name": "测试1", "subject": "数学"}]};
        const depsData = {"version": "test", "dependencies": []};
        const questionsData = {"version": "test", "questions": []};
        
        try {
            var statusEl = document.getElementById('status');
            var resultEl = document.getElementById('result');
            
            statusEl.textContent = 'JavaScript 正常工作！';
            statusEl.className = 'success';
            
            resultEl.innerHTML = '<p class="info">Topics: ' + (topicsData.topics ? topicsData.topics.length : 0) + '</p>' +
                                '<p class="info">Dependencies: ' + (depsData.dependencies ? depsData.dependencies.length : 0) + '</p>' +
                                '<p class="info">Questions: ' + (questionsData.questions ? questionsData.questions.length : 0) + '</p>';
        } catch (e) {
            document.getElementById('status').textContent = '错误: ' + e.message;
            document.getElementById('status').className = 'error';
        }
    </script>
</body>
</html>
