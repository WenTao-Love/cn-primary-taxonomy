        function renderSidebar() {
            const issueList = document.getElementById('issueList');
            issueList.innerHTML = issues.map(issue => `
                <li class="issue-item ${issue.id === 1 ? 'active' : ''}" data-id="${issue.id}">
                    <div class="issue-number">第 ${issue.id} 期</div>
                    <div class="issue-title">${issue.title}</div>
                    <div class="issue-date">${issue.date}</div>
                </li>
            `).join('');
            
            // 绑定点击事件
            document.querySelectorAll('.issue-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.issue-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    const id = parseInt(item.dataset.id);
                    renderArticle(id);
                });
            });
        }

                    <p class="article-date">发布日期：${issue.date}</p>
                    <div class="tags">
                        ${issue.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `;
            
            if (detail) {
                // 头条
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.headline.title}</h2>
                        <div class="section-content">
                            <p>${detail.headline.content}</p>
                            <div class="key-insight">
                                <div class="key-insight-label">💡 核心观点</div>
                                <p>${detail.headline.keyInsight}</p>
                            </div>
                        </div>
                    </div>
                `;
                
                // 分析
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.analysis.title}</h2>
                        <div class="analysis-list">
                            ${detail.analysis.items.map(item => `
                                <div class="analysis-item">
                                    <div class="analysis-percentage">${item.percentage}</div>
                                    <div class="analysis-content">
                                        <h4>${item.reason}</h4>
                                        <p>${item.example}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                // 解决方案
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.solution.title}</h2>
                        ${detail.solution.methods.map(method => `
                            <div class="method-card">
                                <div class="method-name">${method.name}</div>
                                <div class="method-desc">${method.description}</div>
                                <div class="method-detail">
                                    <div class="method-detail-label">为什么有效？</div>
                                    <p>${method.why}</p>
                                </div>
                                <div class="method-detail">
                                    <div class="method-detail-label">怎么做？</div>
                                    <p>${method.how}</p>
                                </div>
                                <div class="method-detail">
                                    <div class="method-detail-label">举个例子</div>
                                    <p>${method.example}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                // 知识点
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.knowledge.title}</h2>
                        <div class="knowledge-box">
                            <div class="one-liner">${detail.knowledge.oneLiner}</div>
                            <div class="key-points">
                                <h4>✅ 核心要点</h4>
                                <ul>
                                    ${detail.knowledge.keyPoints.map(p => `<li>${p}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="common-mistakes">
                                <h4>❌ 常见错误</h4>
                                <ul>
                                    ${detail.knowledge.commonMistakes.map(m => `<li>${m}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="parent-script">
                                <div class="parent-script-label">🗣️ 家长话术</div>
                                <p>${detail.knowledge.parentScript}</p>
                            </div>
                        </div>
                    </div>
                `;
                
                // 工具
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.tools.title}</h2>
                        <div class="tools-grid">
                            ${detail.tools.items.map(tool => `
                                <div class="tool-card">
                                    <div class="tool-name">${tool.name}</div>
                                    <div class="tool-desc">${tool.description}</div>
                                    <div class="tool-how">${tool.how}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                // 案例
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.case.title}</h2>
                        <div class="case-box">
                            <div class="case-author">👤 ${detail.case.author}</div>
                            <div class="case-content">${detail.case.content}</div>
                            <div class="case-takeaway">💡 ${detail.case.keyTakeaway}</div>
                        </div>
                    </div>
                `;
                
                // 测验
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.quiz.title}</h2>
                        <div class="quiz-box">
                            ${detail.quiz.questions.map((q, qi) => `
                                <div class="quiz-question">
                                    <div class="quiz-question-text">${qi + 1}. ${q.question}</div>
                                    <div class="quiz-options">
                                        ${q.options.map((opt, oi) => `
                                            <div class="quiz-option" data-question="${qi}" data-index="${oi}" data-answer="${q.answer}">
                                                ${String.fromCharCode(65 + oi)}. ${opt}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                // 金句
                html += `
                    <div class="section">
                        <h2 class="section-title">${detail.quotes.title}</h2>
                        <div class="quote-box">
                            ${detail.quotes.items.map(q => `
                                <div class="quote-item">
                                    <div class="quote-text">"${q.text}"</div>
                                    <div class="quote-author">—— ${q.author}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                // 下周预告
                html += `
                    <div class="section">
                        <div class="next-week">
                            <div class="next-week-label">${detail.nextWeek.title}</div>
                            <div class="next-week-content">${detail.nextWeek.content}</div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="section">
                        <div class="section-content" style="text-align: center; padding: 60px 0;">
                            <p style="font-size: 18px; color: #718096;">详细内容正在整理中...</p>
                            <p style="margin-top: 20px;">请查看 JSON 源文件：<code>data/weekly-parent-00${id}.json</code></p>
                        </div>
                    </div>
                `;
            }
            
            article.innerHTML = html;
            
            // 绑定测验点击事件
            document.querySelectorAll('.quiz-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    const question = parseInt(this.dataset.question);
                    const index = parseInt(this.dataset.index);
                    const answer = parseInt(this.dataset.answer);
                    const parent = this.parentElement;
                    
                    // 禁用所有选项
                    parent.querySelectorAll('.quiz-option').forEach(o => {
                        o.style.pointerEvents = 'none';
                        if (parseInt(o.dataset.index) === answer) {
                            o.style.background = '#48bb78';
                            o.style.color = 'white';
                            o.style.borderColor = '#48bb78';
                        }
                    });
                    
                    // 标记选择
                    if (index !== answer) {
                        this.style.background = '#f56565';
                        this.style.color = 'white';
                        this.style.borderColor = '#f56565';
                    }
                });
            });
        }
        
        // 初始化
        renderSidebar();
        renderArticle(1);
    </script>
</body>
</html>
