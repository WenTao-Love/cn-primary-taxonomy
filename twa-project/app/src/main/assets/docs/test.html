<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Page</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .success { color: green; font-size: 24px; }
        .error { color: red; font-size: 24px; }
    </style>
</head>
<body>
    <h1>WebView Test</h1>
    <div id="status" class="success">JavaScript is working!</div>
    <div id="data"></div>
    <script>
        // 测试数据加载
        try {
            document.getElementById('data').innerHTML = 
                '<p>Topics: ' + (typeof topicsData !== 'undefined' ? 'loaded' : 'not loaded') + '</p>' +
                '<p>Engine: ' + (typeof DiagnosticEngine !== 'undefined' ? 'loaded' : 'not loaded') + '</p>';
        } catch (e) {
            document.getElementById('data').innerHTML = '<p class="error">Error: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
